<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>职员餐菜谱系统 · 松岗基地</title>

<body style="margin:0">
<div id="daguocai-root">
<style>
#daguocai-root{--bg:#f5f7fa;--panel:#fff;--line:#e6e9ef;--ink:#1f2733;--muted:#6b7482;--brand:#0f766e;--brand2:#14b8a6;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh}
#daguocai-root *{box-sizing:border-box;margin:0;padding:0}
#daguocai-root .shell{max-width:1180px;margin:0 auto;padding:16px}
#daguocai-root h1{font-size:20px;margin-bottom:4px}
#daguocai-root .sub{color:var(--muted);margin-bottom:12px;font-size:13px}
#daguocai-root nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
#daguocai-root nav button{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--brand);font-weight:700;cursor:pointer}
#daguocai-root nav button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
#daguocai-root .page{display:none}
#daguocai-root .page.active{display:block}
#daguocai-root .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
#daguocai-root .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#daguocai-root input,#daguocai-root select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
#daguocai-root button.primary{background:var(--brand);color:#fff;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}
#daguocai-root table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
#daguocai-root th,#daguocai-root td{border:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}
#daguocai-root th{background:#f0faf9;color:#0f5f59}
#daguocai-root .day{background:#eef7f6;font-weight:800;color:var(--brand)}
#daguocai-root td[contenteditable]{outline:none;cursor:text}
#daguocai-root td[contenteditable]:hover{background:#fffbe6}
#daguocai-root td[contenteditable]:focus{background:#fff3cd;box-shadow:inset 0 0 0 2px #f59e0b}
#daguocai-root .side{background:#fffbeb}
#daguocai-root .meal{font-weight:700}
#daguocai-root .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
#daguocai-root .metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
#daguocai-root .metric .num{font-size:24px;font-weight:800;color:var(--brand)}
#daguocai-root .metric .lbl{font-size:12px;color:var(--muted)}
#daguocai-root .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#daguocai-root .recipe{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
#daguocai-root .recipe summary{cursor:pointer;font-weight:800;color:#0f5f59;list-style:none}
#daguocai-root .recipe summary::-webkit-details-marker{display:none}
#daguocai-root .tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;vertical-align:middle}
#daguocai-root .dt{background:#ede9fe;color:#6d28d9}
#daguocai-root .st-spicy{background:#fee2e2;color:#b91c1c}
#daguocai-root .st-canto{background:#dbeafe;color:#1d4ed8}
#daguocai-root .muted{color:var(--muted);font-size:12px}
#daguocai-root .chips{display:flex;flex-wrap:wrap;gap:6px}
#daguocai-root .chip{background:#f1f5f9;border:1px solid #e2e8f0;padding:3px 9px;border-radius:999px;font-size:12px}
#daguocai-root .note{background:#fff7e8;border:1px solid #fde5b8;color:#9a5b12;padding:8px 12px;border-radius:10px;font-size:13px;margin-top:8px}
#daguocai-root ol{margin-left:20px}
@media(max-width:800px){#daguocai-root .pair,#daguocai-root .metrics{grid-template-columns:1fr}}
</style>
<div class="shell">
  <h1>职员餐菜谱系统 · 松岗基地</h1>

  <nav>
    <button data-page="home" class="active">📅 本周菜单</button>
    <button data-page="pair">🧩 智能配菜</button>
    <button data-page="recipes">📖 菜谱库</button>
    <button data-page="categories">🥬 食材分类库</button>

  </section>

  <section id="page-pair" class="page">

        <p class="muted" style="margin-top:10px">荤食类（畜禽肉/水产/蛋/豆制品）</p><select id="proteinSelect"></select>
        
      </div>
      <div class="card"><h3>② 生成结果</h3><div id="pairResult"></div></div>
    </div>
  </section>

    <div id="recipeList"></div>
  </section>

  <section id="page-categories" class="page">
    <div id="catList"></div>
  </section>
</div>

  const RECIPES = DATA.recipes, CATEGORIES = DATA.categories, POOLS = DATA.pools;
  const STYLE = DATA.styleMap, DTYPE = DATA.dishTypeMap, SIDES = DATA.defaultSides, WEEK = DATA.weekNames;
  const styleOf = r => STYLE[String(r.id)] || '粤菜';
  const typeOf = r => DTYPE[String(r.id)] || '大荤';
  const $ = s => root.querySelector(s);
  const $$ = s => [...root.querySelectorAll(s)];
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };

  function nextMonday(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)+7); return d.toISOString().slice(0,10); }
  function buildWeek(){ const n=14; const sides=SIDES.length?SIDES:['红油萝卜丁','剁辣椒']; return {
    spicyMain: shuffle(POOLS.spicyMain).slice(0,n), cantoMain: shuffle(POOLS.cantoMain).slice(0,n),
    spicySide: shuffle(POOLS.spicySide).slice(0,n), cantoSide: shuffle(POOLS.cantoSide).slice(0,n),
    green: shuffle(POOLS.green).slice(0,n), soup: shuffle(POOLS.soup).slice(0,n), staple: shuffle(POOLS.staple).slice(0,n),
    sideDish: Array.from({length:14},(_,k)=>sides[k%sides.length]) }; }
  let week = buildWeek();

  function renderMenu(){
    const start = new Date($('#weekStart').value + 'T00:00:00');
    const rows=[];
    for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const label=(d.getMonth()+1)+'/'+d.getDate()+' '+WEEK[i];
      for(let m=0;m<2;m++){ const s=i*2+m; const meal=m===0?'午餐':'晚餐';
        const cells='<td class="meal">'+meal+'</td><td contenteditable="true">'+esc(week.spicyMain[s])+'</td><td contenteditable="true">'+esc(week.spicySide[s])+'</td><td contenteditable="true">'+esc(week.cantoMain[s])+'</td><td contenteditable="true">'+esc(week.cantoSide[s])+'</td><td contenteditable="true">'+esc(week.green[s])+'</td><td contenteditable="true">'+esc(week.soup[s])+'</td><td contenteditable="true">'+esc(week.staple[s])+'</td>';
        if(m===0){ rows.push('<tr><td class="day" rowspan="2">'+label+'</td>'+cells+'<td class="side" contenteditable="true" rowspan="2">'+esc(week.sideDish[i*2])+'<br>'+esc(week.sideDish[i*2+1])+'</td></tr>'); }

    $('#sideList').textContent = SIDES.join('、');

  function fillPair(){ const vegs=[...new Set(RECIPES.map(r=>r.veg))]; const pros=[...new Set(RECIPES.map(r=>r.protein))];
    $('#vegSelect').innerHTML = vegs.map(v=>'<option>'+esc(v)+'</option>').join('');
    $('#proteinSelect').innerHTML = pros.map(p=>'<option>'+esc(p)+'</option>').join('');
    $('#vegSelect').value = vegs.includes('辣椒')?'辣椒':vegs[0]; $('#proteinSelect').value = pros.includes('牛肉')?'牛肉':pros[0]; }

  function renderPair(){
    const veg=$('#vegSelect').value, pro=$('#proteinSelect').value;
    const box=$('#pairResult'); const hits=RECIPES.filter(r=>r.veg===veg && r.protein===pro);
    if(!hits.length){ box.innerHTML='<div class="note">没有找到「'+esc(veg)+' × '+esc(pro)+'」的固定搭配。</div>'; return; }
    box.innerHTML = hits.map(r=>{ const st=styleOf(r), dt=typeOf(r);
      return '<div class="recipe"><h3>'+esc(r.name)+' <span class="tag dt">'+dt+'</span> <span class="tag '+(st==='辣菜'?'st-spicy':'st-canto')+'">'+st+'</span> <span class="muted">'+esc(r.taste)+'</span></h3><p><b>配料：</b>'+esc(r.ingredients.join('、'))+'</p><p><b>调料：</b>'+esc(r.seasonings.join('、'))+'</p><ol>'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div>';

  }
  function renderRecipes(){
    const q=$('#recipeSearch').value.trim().toLowerCase(), cat=$('#catFilter').value, st=$('#styleFilter').value, dt=$('#typeFilter').value;
    let list=RECIPES.filter(r=>{ const s=styleOf(r), t=typeOf(r); const hay=(r.name+' '+r.veg+' '+r.protein+' '+r.cat+' '+s+' '+t+' '+r.taste+' '+r.ingredients.join(' ')+' '+r.seasonings.join(' ')).toLowerCase();
      return (!q||hay.includes(q)) && (!cat||r.cat===cat) && (!st||s===st) && (!dt||t===dt); });
    $('#recipeList').innerHTML = list.map(r=>{ const s=styleOf(r), t=typeOf(r);
      return '<details class="recipe"><summary>'+esc(r.name)+' <span class="tag dt">'+t+'</span> <span class="tag '+(s==='辣菜'?'st-spicy':'st-canto')+'">'+s+'</span> <span class="muted">'+esc(r.veg)+' × '+esc(r.protein)+' · '+esc(r.cat)+' · '+esc(r.taste)+'</span></summary><p><b>配料：</b>'+esc(r.ingredients.join('、'))+'</p><p><b>调料：</b>'+esc(r.seasonings.join('、'))+'</p><ol>'+r.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></details>';
    }).join('') || '<div class="note">没有匹配的菜谱。</div>';
  }

  function renderCats(){ $('#catList').innerHTML = CATEGORIES.map(c=>'<div class="card"><h3>'+c.emoji+' '+esc(c.name)+' <span class="muted">'+c.items.length+'项</span></h3><div class="chips">'+c.items.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div></div>').join(''); }

  function switchTab(name){ $$('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name)); $$('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name)); }

  $$('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.page)));
  $('#btnGenerate').addEventListener('click',()=>{ week=buildWeek(); renderMenu(); });
  $('#btnRegen').addEventListener('click',()=>{ week=buildWeek(); renderMenu(); });
  $('#vegSelect').addEventListener('change',renderPair);
  $('#proteinSelect').addEventListener('change',renderPair);
    ['recipeSearch','catFilter','styleFilter','typeFilter'].forEach(id=>$('#'+id).addEventListener('input',renderRecipes));

  $('#weekStart').value = nextMonday();
  fillPair(); renderMenu(); renderPair(); renderRecipes(); renderCats();
})();
</script>
</body>
</html>
